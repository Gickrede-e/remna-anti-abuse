services:
  anti-abuse:
    build: .
    image: remna-anti-abuse:latest
    container_name: remna-anti-abuse
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3088:3088"
    volumes:
      - anti-abuse-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3088/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  anti-abuse-data:
